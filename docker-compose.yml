name: maksim_kuznetsov

services:
  db:
    image: postgres:16
    container_name: maksim_kuznetsov_db
    environment:
      POSTGRES_USER: maksim_kuznetsov
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: maksim_kuznetsov
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    ports:
      - "5544:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
